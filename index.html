<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesture-Controlled Fruit Ninja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="webcam" autoplay playsinline style="display: none;"></video>
  <canvas id="gameCanvas"></canvas>

  <!-- Game Over UI Overlay -->
  <div id="gameOverScreen" class="overlay hidden">
    <div class="game-over-card">
      <h1 class="game-over-title">Game Over</h1>
      <p class="final-score-text">Final Score: <span id="finalScore" class="final-score-value">0</span></p>
      <button id="restartBtn" class="restart-btn">Play Again</button>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
